syntax = "proto3";

package pi.client.protocol.v0;

// This package is an unpublished protocol spike. Its package name and field
// numbers are intentionally versioned, but they do not declare Protocol 1.0.

// PiTransportFrame is the single public Protobuf wire envelope. Multiplexing
// identifiers remain flat scalar fields on typed operations.
message PiTransportFrame {
  uint64 frame_sequence = 1;

  oneof operation {
    BootstrapHello bootstrap_hello = 10;
    HealthRequest health_request = 11;
    HealthResponse health_response = 12;
    EventStreamEnvelope event_stream = 13;
    Cancel cancel = 14;
    WindowUpdate window_update = 15;
    TransferOpen transfer_open = 16;
    TransferChunk transfer_chunk = 17;
    TransferAck transfer_ack = 18;
    TransferComplete transfer_complete = 19;
    TransferAbort transfer_abort = 20;
    ErrorEnvelope error = 21;
  }

  reserved 2 to 9;
  reserved 22 to 31;
}

enum PeerRole {
  PEER_ROLE_UNSPECIFIED = 0;
  PEER_ROLE_CLIENT = 1;
  PEER_ROLE_NODE = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_HEALTH_UNARY = 1;
  CAPABILITY_EVENT_STREAM = 2;
  CAPABILITY_CANCELLATION = 3;
  CAPABILITY_FLOW_CONTROL = 4;
  CAPABILITY_TRANSFER = 5;
}

message BootstrapHello {
  string connection_id = 1;
  string peer_id = 2;
  PeerRole role = 3;
  uint32 protocol_major = 4;
  uint32 protocol_minor = 5;
  string implementation_name = 6;
  string implementation_version = 7;
  uint32 max_frame_bytes = 8;
  uint32 max_transfer_chunk_bytes = 9;
  repeated Capability capabilities = 10;
}

message HealthRequest {
  string request_id = 1;
  bool include_build_info = 2;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_STARTING = 1;
  HEALTH_STATUS_SERVING = 2;
  HEALTH_STATUS_DEGRADED = 3;
  HEALTH_STATUS_STOPPING = 4;
}

message HealthResponse {
  string request_id = 1;
  HealthStatus status = 2;
  string node_version = 3;
  uint64 uptime_millis = 4;
}

message EventStreamEnvelope {
  string stream_id = 1;
  uint64 event_sequence = 2;

  oneof event {
    HeartbeatEvent heartbeat = 10;
    HealthStatusChangedEvent health_status_changed = 11;
    StreamClosedEvent stream_closed = 12;
  }

  reserved 3 to 9;
}

message HeartbeatEvent {
  uint64 observed_unix_millis = 1;
}

message HealthStatusChangedEvent {
  HealthStatus status = 1;
  string summary = 2;
}

message StreamClosedEvent {
  bool graceful = 1;
  StableError error = 2;
}

message Cancel {
  oneof target {
    string request_id = 1;
    string stream_id = 2;
    string transfer_id = 3;
  }

  string reason = 4;
}

message WindowUpdate {
  oneof target {
    string stream_id = 1;
    string transfer_id = 2;
  }

  uint32 credit_messages = 3;
  uint64 credit_bytes = 4;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_UPLOAD = 1;
  TRANSFER_DIRECTION_DOWNLOAD = 2;
}

enum TransferPurpose {
  TRANSFER_PURPOSE_UNSPECIFIED = 0;
  TRANSFER_PURPOSE_FILE = 1;
  TRANSFER_PURPOSE_ATTACHMENT = 2;
  TRANSFER_PURPOSE_EXPORT = 3;
}

message TransferOpen {
  string transfer_id = 1;
  TransferDirection direction = 2;
  TransferPurpose purpose = 3;
  string content_type = 4;
  string file_name = 5;
  uint64 total_bytes = 6;
  uint32 chunk_bytes = 7;
  bytes sha256 = 8;
}

message TransferChunk {
  string transfer_id = 1;
  uint64 chunk_sequence = 2;
  uint64 offset = 3;
  bytes data = 4;
}

message TransferAck {
  string transfer_id = 1;
  uint64 acknowledged_sequence = 2;
  uint64 committed_bytes = 3;
}

message TransferComplete {
  string transfer_id = 1;
  uint64 total_bytes = 2;
  bytes sha256 = 3;
}

message TransferAbort {
  string transfer_id = 1;
  StableError error = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_ALREADY_EXISTS = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_FAILED_PRECONDITION = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_DEADLINE_EXCEEDED = 10;
  ERROR_CODE_UNAVAILABLE = 11;
  ERROR_CODE_DATA_LOSS = 12;
  ERROR_CODE_INTERNAL = 13;
  ERROR_CODE_PROTOCOL_VIOLATION = 14;
  ERROR_CODE_UNSUPPORTED_VERSION = 15;
}

message StableError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint32 retry_after_millis = 4;
}

message ErrorEnvelope {
  oneof correlation {
    string request_id = 1;
    string stream_id = 2;
    string transfer_id = 3;
  }

  StableError error = 4;
}
