syntax = "proto3";

package pi.client.protocol.v0;

// This package is an unpublished protocol spike. Its package name and field
// numbers are intentionally versioned, but they do not declare Protocol 1.0.

// PiTransportFrame is the single public Protobuf wire envelope. Numeric
// multiplexing identifiers use uint64; domain and transport resource
// identifiers remain opaque strings.
message PiTransportFrame {
  uint64 frame_sequence = 1;

  oneof operation {
    ClientProtocolOffer client_protocol_offer = 10;
    ServerHandshakeAccepted server_handshake_accepted = 11;
    ServerHandshakeRejected server_handshake_rejected = 12;

    HealthRequest health_request = 20;
    HealthResponse health_response = 21;
    GetProjectBootstrapRequest get_project_bootstrap_request = 22;
    GetProjectBootstrapResponse get_project_bootstrap_response = 23;
    BrowseDirectoryRequest browse_directory_request = 24;
    BrowseDirectoryResponse browse_directory_response = 25;
    ValidateProjectRequest validate_project_request = 26;
    ValidateProjectResponse validate_project_response = 27;
    ListKnownProjectsRequest list_known_projects_request = 28;
    ListKnownProjectsResponse list_known_projects_response = 29;

    ListSessionsRequest list_sessions_request = 30;
    ListSessionsResponse list_sessions_response = 31;
    GetSessionRequest get_session_request = 32;
    GetSessionResponse get_session_response = 33;
    CreateSessionRequest create_session_request = 34;
    CreateSessionResponse create_session_response = 35;
    PromptCommand prompt_command = 36;
    AbortCommand abort_command = 37;
    RequestRejected request_rejected = 38;
    CommandAccepted command_accepted = 39;
    CommandRejected command_rejected = 40;
    ApproveProjectTrustRequest approve_project_trust_request = 41;
    ApproveProjectTrustResponse approve_project_trust_response = 42;
    RenameSessionCommand rename_session_command = 43;
    ClearSessionNameCommand clear_session_name_command = 44;
    AutoNameSessionCommand auto_name_session_command = 45;
    DeleteSessionCommand delete_session_command = 46;
    SessionAdminCommandOutcome session_admin_command_outcome = 47;
    GetSessionTreeRequest get_session_tree_request = 48;
    GetSessionTreeResponse get_session_tree_response = 49;

    SessionEventStreamEnvelope session_event_stream = 50;
    EventStreamEnvelope event_stream = 51;
    NavigateSessionTreeCommand navigate_session_tree_command = 52;
    ForkSessionCommand fork_session_command = 53;
    CloneSessionCommand clone_session_command = 54;
    SessionTreeMutationOutcome session_tree_mutation_outcome = 55;

    Cancel cancel = 60;
    WindowUpdate window_update = 61;

    TransferOpen transfer_open = 70;
    TransferChunk transfer_chunk = 71;
    TransferAck transfer_ack = 72;
    TransferComplete transfer_complete = 73;
    TransferAbort transfer_abort = 74;

    ErrorEnvelope error = 80;
  }

  reserved 2 to 9;
  reserved 13 to 19;
  reserved 56 to 59;
  reserved 62 to 69;
  reserved 75 to 79;
  reserved 81 to 99;
}

// ProtocolVersion is the numeric SemVer core used for exact wire negotiation.
// The v0 package accepts only major zero. Prerelease and build identifiers are
// intentionally not part of protocol identity.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SESSION_READ = 1;
  CAPABILITY_SESSION_CREATE = 2;
  CAPABILITY_PROMPT_COMMAND = 3;
  CAPABILITY_ABORT_COMMAND = 4;
  CAPABILITY_SESSION_EVENTS = 5;
  CAPABILITY_HEALTH = 6;
  CAPABILITY_CANCELLATION = 7;
  CAPABILITY_FLOW_CONTROL = 8;
  CAPABILITY_TRANSFER = 9;
  CAPABILITY_PROJECT_DISCOVERY = 10;
  CAPABILITY_PROJECT_TRUST = 11;
  CAPABILITY_SESSION_ADMIN = 12;
  CAPABILITY_SESSION_TREE = 13;
}

// protocol_versions is ordered by client preference. The server selects one
// exact offered version and a subset of the advertised capabilities.
message ClientProtocolOffer {
  repeated ProtocolVersion protocol_versions = 1;
  repeated Capability capabilities = 2;
  string client_instance_id = 3;
  string implementation_name = 4;
  string implementation_version = 5;
  uint32 max_frame_bytes = 6;
  uint32 max_transfer_chunk_bytes = 7;
}

message ServerHandshakeAccepted {
  ProtocolVersion selected_protocol_version = 1;
  repeated Capability capabilities = 2;
  string node_instance_id = 3;
  string implementation_name = 4;
  string implementation_version = 5;
  uint32 max_frame_bytes = 6;
  uint32 max_transfer_chunk_bytes = 7;
}

message ServerHandshakeRejected {
  StableError error = 1;
  repeated ProtocolVersion supported_protocol_versions = 2;
}

message HealthRequest {
  uint64 request_id = 1;
  bool include_build_info = 2;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_STARTING = 1;
  HEALTH_STATUS_SERVING = 2;
  HEALTH_STATUS_DEGRADED = 3;
  HEALTH_STATUS_STOPPING = 4;
}

message HealthResponse {
  uint64 request_id = 1;
  HealthStatus status = 2;
  string node_version = 3;
  uint64 uptime_millis = 4;
}

message GetProjectBootstrapRequest {
  uint64 request_id = 1;
}

message GetProjectBootstrapResponse {
  uint64 request_id = 1;
  string home_directory = 2;
  ProjectSnapshot default_project = 3;
}

message BrowseDirectoryRequest {
  uint64 request_id = 1;
  string directory = 2;
  uint32 max_children = 3;
}

message BrowseDirectoryResponse {
  uint64 request_id = 1;
  DirectoryListingSnapshot directory = 2;
}

message ValidateProjectRequest {
  uint64 request_id = 1;
  string candidate_directory = 2;
}

message ValidateProjectResponse {
  uint64 request_id = 1;
  ProjectSnapshot project = 2;
}

message ListKnownProjectsRequest {
  uint64 request_id = 1;
  uint32 max_projects = 2;
}

message ListKnownProjectsResponse {
  uint64 request_id = 1;
  repeated KnownProjectSnapshot projects = 2;
}

message ApproveProjectTrustRequest {
  uint64 request_id = 1;
  string project_id = 2;
  string trust_revision = 3;
}

message ApproveProjectTrustResponse {
  uint64 request_id = 1;
  ProjectSnapshot project = 2;
}

message DirectoryListingSnapshot {
  string canonical_directory = 1;
  string parent_directory = 2;
  repeated DirectoryEntrySnapshot children = 3;
  bool truncated = 4;
}

message DirectoryEntrySnapshot {
  string name = 1;
  string canonical_path = 2;
  bool is_symbolic_link = 3;
}

enum ProjectTrustStatus {
  PROJECT_TRUST_STATUS_UNSPECIFIED = 0;
  PROJECT_TRUST_STATUS_NOT_REQUIRED = 1;
  PROJECT_TRUST_STATUS_TRUSTED = 2;
  PROJECT_TRUST_STATUS_APPROVAL_REQUIRED = 3;
  PROJECT_TRUST_STATUS_DENIED = 4;
}

enum ProjectTrustReason {
  PROJECT_TRUST_REASON_UNSPECIFIED = 0;
  PROJECT_TRUST_REASON_PI_SETTINGS = 1;
  PROJECT_TRUST_REASON_PI_EXTENSIONS = 2;
  PROJECT_TRUST_REASON_PI_SKILLS = 3;
  PROJECT_TRUST_REASON_PI_PROMPTS = 4;
  PROJECT_TRUST_REASON_PI_THEMES = 5;
  PROJECT_TRUST_REASON_PI_SYSTEM_PROMPT = 6;
  PROJECT_TRUST_REASON_AGENT_SKILLS = 7;
  PROJECT_TRUST_REASON_SAVED_APPROVAL = 8;
  PROJECT_TRUST_REASON_SAVED_DENIAL = 9;
}

message ProjectTrustSnapshot {
  ProjectTrustStatus status = 1;
  repeated ProjectTrustReason reasons = 2;
  string revision = 3;
}

message ProjectIdentitySnapshot {
  string project_id = 1;
  string canonical_working_directory = 2;
  bool is_git_repository = 3;
  string git_root = 4;
  string main_worktree_root = 5;
  string branch = 6;
  bool is_linked_worktree = 7;
  bool is_detached_head = 8;
  string worktree_id = 9;
  string main_project_id = 10;
}

message ProjectSnapshot {
  ProjectIdentitySnapshot identity = 1;
  ProjectTrustSnapshot trust = 2;
}

message KnownProjectSnapshot {
  ProjectSnapshot project = 1;
  uint64 last_session_at_unix_millis = 2;
  uint32 session_count = 3;
}

message ListSessionsRequest {
  uint64 request_id = 1;
  string project_id = 2;
}

message ListSessionsResponse {
  uint64 request_id = 1;
  repeated SessionSummarySnapshot sessions = 2;
}

message GetSessionRequest {
  uint64 request_id = 1;
  string session_id = 2;
  string project_id = 3;
}

message GetSessionResponse {
  uint64 request_id = 1;
  SessionDetailSnapshot session = 2;
}

message CreateSessionRequest {
  uint64 request_id = 1;
  string project_id = 2;
}

message CreateSessionResponse {
  uint64 request_id = 1;
  SessionDetailSnapshot session = 2;
}

message PromptCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string session_id = 3;
  string prompt = 4;
}

message AbortCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string session_id = 3;
}

enum SessionAdminOperation {
  SESSION_ADMIN_OPERATION_UNSPECIFIED = 0;
  SESSION_ADMIN_OPERATION_RENAME = 1;
  SESSION_ADMIN_OPERATION_CLEAR_NAME = 2;
  SESSION_ADMIN_OPERATION_AUTO_NAME = 3;
  SESSION_ADMIN_OPERATION_DELETE = 4;
}

message RenameSessionCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  string name = 5;
}

message ClearSessionNameCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
}

message AutoNameSessionCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  uint32 timeout_millis = 5;
}

message DeleteSessionConfirmationEvidence {
  string session_id = 1;
  string admin_revision = 2;
  string displayed_title = 3;
  bool destructive_action_acknowledged = 4;
}

message DeleteSessionCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  DeleteSessionConfirmationEvidence confirmation = 5;
}

message DeleteSessionOutcome {
  string session_id = 1;
  uint32 reparented_child_count = 2;
}

message SessionAdminCommandOutcome {
  uint64 request_id = 1;
  string command_id = 2;
  SessionAdminOperation operation = 3;

  oneof outcome {
    SessionSummarySnapshot session = 10;
    DeleteSessionOutcome deletion = 11;
    StableError error = 12;
  }

  reserved 4 to 9;
}

message GetSessionTreeRequest {
  uint64 request_id = 1;
  string project_id = 2;
  string session_id = 3;
}

message GetSessionTreeResponse {
  uint64 request_id = 1;
  SessionTreeSnapshot tree = 2;
}

enum SessionTreeMutationOperation {
  SESSION_TREE_MUTATION_OPERATION_UNSPECIFIED = 0;
  SESSION_TREE_MUTATION_OPERATION_NAVIGATE = 1;
  SESSION_TREE_MUTATION_OPERATION_FORK = 2;
  SESSION_TREE_MUTATION_OPERATION_CLONE = 3;
}

message NavigateSessionTreeCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  string entry_id = 5;
  string expected_admin_revision = 6;
}

message ForkSessionCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  string user_entry_id = 5;
  string expected_admin_revision = 6;
}

message CloneSessionCommand {
  uint64 request_id = 1;
  string command_id = 2;
  string project_id = 3;
  string session_id = 4;
  string expected_admin_revision = 5;
}

message SessionTreeMutationResult {
  SessionDetailSnapshot session = 1;
  SessionTreeSnapshot tree = 2;
  string editor_text = 3;
}

message SessionTreeMutationOutcome {
  uint64 request_id = 1;
  string command_id = 2;
  SessionTreeMutationOperation operation = 3;

  oneof outcome {
    SessionTreeMutationResult result = 10;
    StableError error = 11;
  }

  reserved 4 to 9;
}

message RequestRejected {
  uint64 request_id = 1;
  StableError error = 2;
}

message CommandAccepted {
  uint64 request_id = 1;
  string command_id = 2;
}

message CommandRejected {
  uint64 request_id = 1;
  string command_id = 2;
  StableError error = 3;
}

message SessionSummarySnapshot {
  string session_id = 1;
  string title = 2;
  string working_directory = 3;
  uint64 created_at_unix_millis = 4;
  uint64 updated_at_unix_millis = 5;
  bool is_running = 6;
  bool has_unread = 7;
  string admin_revision = 8;
  bool has_custom_name = 9;
  string parent_session_id = 10;
}

message SessionDetailSnapshot {
  SessionSummarySnapshot summary = 1;
  repeated MessageSnapshot messages = 2;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
  MESSAGE_ROLE_TOOL = 3;
  MESSAGE_ROLE_SYSTEM = 4;
}

message MessageSnapshot {
  string message_id = 1;
  MessageRole role = 2;
  string text = 3;
  uint64 created_at_unix_millis = 4;
  bool is_streaming = 5;
}

enum SessionTreeEntryKind {
  SESSION_TREE_ENTRY_KIND_UNSPECIFIED = 0;
  SESSION_TREE_ENTRY_KIND_USER_MESSAGE = 1;
  SESSION_TREE_ENTRY_KIND_ASSISTANT_MESSAGE = 2;
  SESSION_TREE_ENTRY_KIND_TOOL_MESSAGE = 3;
  SESSION_TREE_ENTRY_KIND_CUSTOM_MESSAGE = 4;
  SESSION_TREE_ENTRY_KIND_THINKING_LEVEL = 5;
  SESSION_TREE_ENTRY_KIND_MODEL_CHANGE = 6;
  SESSION_TREE_ENTRY_KIND_COMPACTION = 7;
  SESSION_TREE_ENTRY_KIND_BRANCH_SUMMARY = 8;
  SESSION_TREE_ENTRY_KIND_CUSTOM = 9;
  SESSION_TREE_ENTRY_KIND_LABEL = 10;
  SESSION_TREE_ENTRY_KIND_SESSION_INFO = 11;
}

message SessionTreeNodeSnapshot {
  string entry_id = 1;
  string parent_entry_id = 2;
  SessionTreeEntryKind kind = 3;
  string text = 4;
  uint64 created_at_unix_millis = 5;
  string label = 6;
  uint32 depth = 7;
  bool is_on_active_path = 8;
  bool has_children = 9;
  bool can_edit_from_here = 10;
  bool can_fork = 11;
}

message SessionTreeSnapshot {
  string session_id = 1;
  repeated SessionTreeNodeSnapshot nodes = 2;
  repeated string active_path_entry_ids = 3;
  string active_leaf_entry_id = 4;
  bool can_clone_active_branch = 5;
  string admin_revision = 6;
}

// Each stream is bound to one session. event_sequence is strictly increasing
// within stream_id and is independent of PiTransportFrame.frame_sequence.
message SessionEventStreamEnvelope {
  string stream_id = 1;
  string session_id = 2;
  uint64 event_sequence = 3;

  oneof event {
    MessageAddedEvent message_added = 10;
    MessageDeltaEvent message_delta = 11;
    SessionRunningChangedEvent running_changed = 12;
    CommandCompletedEvent command_completed = 13;
    StreamClosedEvent stream_closed = 14;
  }

  reserved 4 to 9;
}

message MessageAddedEvent {
  MessageSnapshot message = 1;
}

message MessageDeltaEvent {
  string message_id = 1;
  string delta = 2;
}

message SessionRunningChangedEvent {
  bool is_running = 1;
}

message CommandCompletedEvent {
  string command_id = 1;
  bool succeeded = 2;
  StableError error = 3;
}

// EventStreamEnvelope retains non-session streams used by transport health and
// future bounded control surfaces.
message EventStreamEnvelope {
  string stream_id = 1;
  uint64 event_sequence = 2;

  oneof event {
    HeartbeatEvent heartbeat = 10;
    HealthStatusChangedEvent health_status_changed = 11;
    StreamClosedEvent stream_closed = 12;
  }

  reserved 3 to 9;
}

message HeartbeatEvent {
  uint64 observed_unix_millis = 1;
}

message HealthStatusChangedEvent {
  HealthStatus status = 1;
  string summary = 2;
}

message StreamClosedEvent {
  bool graceful = 1;
  StableError error = 2;
}

message Cancel {
  oneof target {
    uint64 request_id = 1;
    string stream_id = 2;
    string transfer_id = 3;
  }

  string reason = 4;
}

message WindowUpdate {
  oneof target {
    string stream_id = 1;
    string transfer_id = 2;
  }

  uint32 credit_messages = 3;
  uint64 credit_bytes = 4;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_UPLOAD = 1;
  TRANSFER_DIRECTION_DOWNLOAD = 2;
}

enum TransferPurpose {
  TRANSFER_PURPOSE_UNSPECIFIED = 0;
  TRANSFER_PURPOSE_FILE = 1;
  TRANSFER_PURPOSE_ATTACHMENT = 2;
  TRANSFER_PURPOSE_EXPORT = 3;
}

message TransferOpen {
  string transfer_id = 1;
  TransferDirection direction = 2;
  TransferPurpose purpose = 3;
  string content_type = 4;
  string file_name = 5;
  uint64 total_bytes = 6;
  uint32 chunk_bytes = 7;
  bytes sha256 = 8;
}

message TransferChunk {
  string transfer_id = 1;
  uint64 chunk_sequence = 2;
  uint64 offset = 3;
  bytes data = 4;
}

message TransferAck {
  string transfer_id = 1;
  uint64 acknowledged_sequence = 2;
  uint64 committed_bytes = 3;
}

message TransferComplete {
  string transfer_id = 1;
  uint64 total_bytes = 2;
  bytes sha256 = 3;
}

message TransferAbort {
  string transfer_id = 1;
  StableError error = 2;
}

// ErrorCode maps to the hand-written Flutter semantic error boundary. Unknown
// numeric enum values are protocol violations rather than remote rejections.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTHENTICATION_REQUIRED = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_INVALID_REQUEST = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_NODE_BUSY = 6;
  ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED = 7;
  ERROR_CODE_CANCELLED = 8;
  ERROR_CODE_DEADLINE_EXCEEDED = 9;
  ERROR_CODE_UNAVAILABLE = 10;
  ERROR_CODE_DATA_LOSS = 11;
  ERROR_CODE_INTERNAL = 12;
  ERROR_CODE_PROTOCOL_VIOLATION = 13;
  ERROR_CODE_RESOURCE_EXHAUSTED = 14;
  ERROR_CODE_ALREADY_EXISTS = 15;
  ERROR_CODE_FAILED_PRECONDITION = 16;
}

message StableError {
  ErrorCode code = 1;
  bool retryable = 2;
  uint32 retry_after_millis = 3;
  string safe_message = 4;
}

message ErrorEnvelope {
  oneof correlation {
    uint64 request_id = 1;
    string stream_id = 2;
    string transfer_id = 3;
  }

  StableError error = 4;
}
