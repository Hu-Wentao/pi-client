name: Release unsigned macOS preview

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require the main branch
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "Run this workflow from ${EXPECTED_REF}; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        run: node tool/release_metadata.mjs --github-output "$GITHUB_OUTPUT"

      - name: Reject existing release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Local tag ${TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Remote tag ${TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists." >&2
            exit 1
          fi

      - name: Set up Dart 3.11.4
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.11.4

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/3.41.6
          key: macos-fvm-flutter-3.41.6

      - name: Install FVM 4.0.5 and Flutter 3.41.6
        run: |
          dart pub global activate fvm 4.0.5
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" install 3.41.6
          "$HOME/.pub-cache/bin/fvm" use 3.41.6 --force

      - name: Resolve Flutter dependencies
        run: fvm flutter pub get

      - name: Verify generated Dart sources
        run: |
          fvm dart run build_runner build
          if ! git diff --exit-code -- lib test; then
            echo 'Generated Dart sources are stale.' >&2
            exit 1
          fi

      - name: Analyze and test Flutter source
        run: |
          fvm dart format --output=none --set-exit-if-changed lib test tool
          fvm flutter analyze
          fvm flutter test

      - name: Build Debug app
        run: fvm flutter build macos --debug

      - name: Configure unsigned preview Release build
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.buildNumber }}
        run: |
          fvm flutter build macos \
            --release \
            --config-only \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=PI_CLIENT_DISTRIBUTION_CHANNEL=unsigned-preview

      - name: Build unsigned Universal app
        env:
          DERIVED_DATA: ${{ runner.temp }}/pi-client-derived-data
        run: |
          set -o pipefail
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -arch arm64 \
            -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app identity and architecture
        id: app
        env:
          DERIVED_DATA: ${{ runner.temp }}/pi-client-derived-data
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.buildNumber }}
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Pi Client.app"
          PLIST="$APP/Contents/Info.plist"
          EXECUTABLE="$APP/Contents/MacOS/Pi Client"
          test -d "$APP"
          test -x "$EXECUTABLE"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" == 'Pi Client' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")" == 'Pi Client' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" == 'io.github.huwentao.piClient' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")" == '11.0' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' macos/Runner/Release.entitlements)" == 'true' ]]

          MACH_O_COUNT=0
          while IFS= read -r -d '' BINARY; do
            if file "$BINARY" | grep -q 'Mach-O'; then
              MACH_O_COUNT=$((MACH_O_COUNT + 1))
              ARCHS="$(lipo -archs "$BINARY")"
              [[ " $ARCHS " == *" arm64 "* ]]
              [[ " $ARCHS " == *" x86_64 "* ]]
            fi
          done < <(find "$APP/Contents" -type f -perm -111 -print0)
          [[ "$MACH_O_COUNT" -gt 0 ]]

          if codesign --verify --deep --strict "$APP" >/dev/null 2>&1; then
            echo 'Expected an unsigned app, but code-sign verification passed.' >&2
            exit 1
          fi
          if spctl --assess --type execute "$APP" >/dev/null 2>&1; then
            echo 'Expected Gatekeeper to reject the unsigned preview.' >&2
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Launch unsigned preview without Keychain entitlement errors
        env:
          APP: ${{ steps.app.outputs.path }}
        run: |
          LOG="$RUNNER_TEMP/pi-client-launch.log"
          "$APP/Contents/MacOS/Pi Client" >"$LOG" 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" >/dev/null 2>&1; then
            cat "$LOG"
            echo 'Pi Client exited during the unsigned-preview launch check.' >&2
            exit 1
          fi
          kill "$PID"
          wait "$PID" || true
          if grep -Eiq -- '-34018|errSecMissingEntitlement|keychain.*entitlement' "$LOG"; then
            cat "$LOG"
            echo 'Unsigned preview attempted unavailable Keychain access.' >&2
            exit 1
          fi

      - name: Package app and checksum
        env:
          APP: ${{ steps.app.outputs.path }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          CHECKSUM_ASSET: ${{ steps.metadata.outputs.checksumAsset }}
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/$ASSET"
          (
            cd artifacts
            shasum -a 256 "$ASSET" > "$CHECKSUM_ASSET"
          )
          unzip -t "artifacts/$ASSET"

      - name: Create immutable release tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "Pi Client ${VERSION}"
          git push origin "refs/tags/$TAG"
          [[ "$(git rev-parse "${TAG}^{commit}")" == "$GITHUB_SHA" ]]

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          CHECKSUM_ASSET: ${{ steps.metadata.outputs.checksumAsset }}
        run: |
          gh release create "$TAG" \
            "artifacts/$ASSET" \
            "artifacts/$CHECKSUM_ASSET" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Pi Client ${VERSION} unsigned macOS preview" \
            --notes-file ".github/release-notes/${TAG}.md"

      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          CHECKSUM_ASSET: ${{ steps.metadata.outputs.checksumAsset }}
        run: |
          RELEASE_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -c --arg tag "$TAG" '
                [.[] | select(.tag_name == $tag and .draft == true)] |
                if length == 1 then .[0]
                else error("expected exactly one draft release for " + $tag)
                end
              '
          )"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          jq -r '.assets[].name' <<<"$RELEASE_JSON" | grep -Fxq "$ASSET"
          jq -r '.assets[].name' <<<"$RELEASE_JSON" | grep -Fxq "$CHECKSUM_ASSET"
          [[ "$(jq --arg name "$ASSET" '[.assets[] | select(.name == $name) | .size > 0] | all' <<<"$RELEASE_JSON")" == 'true' ]]
          [[ "$(jq --arg name "$CHECKSUM_ASSET" '[.assets[] | select(.name == $name) | .size > 0] | all' <<<"$RELEASE_JSON")" == 'true' ]]
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true >/dev/null
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')" == 'false' ]]

      - name: Request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
