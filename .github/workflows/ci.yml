name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  DART_VERSION: 3.11.4
  FLUTTER_VERSION: 3.41.6
  FVM_VERSION: 4.0.5
  NODE_VERSION: 22.19.0

jobs:
  flutter-quality:
    name: Flutter quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart ${{ env.DART_VERSION }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/${{ env.FLUTTER_VERSION }}
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-fvm-${{ env.FVM_VERSION }}

      - name: Install FVM and Flutter
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" install "$FLUTTER_VERSION"
          "$HOME/.pub-cache/bin/fvm" use "$FLUTTER_VERSION" --force

      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: fvm dart format --output=none --set-exit-if-changed lib test tool

      - name: Verify generated Dart sources
        run: |
          fvm dart run build_runner build
          if ! git diff --exit-code -- lib test; then
            echo 'Generated Dart sources are stale.' >&2
            exit 1
          fi

      - name: Analyze Flutter source
        run: fvm flutter analyze --no-pub

      - name: Test Flutter source
        run: fvm flutter test --no-pub

      - name: Verify source tree remains unchanged
        run: git diff --exit-code

  node:
    name: Pi Node package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked Pi Node dependencies
        working-directory: node
        run: bun install --frozen-lockfile

      - name: Run the full Pi Node check
        working-directory: node
        run: bun run check

      - name: Verify tracked Pi Node sources remain unchanged
        run: git diff --exit-code -- node

  protocol:
    name: Pi Protocol package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Dart ${{ env.DART_VERSION }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/${{ env.FLUTTER_VERSION }}
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-fvm-${{ env.FVM_VERSION }}

      - name: Install FVM and Flutter
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" install "$FLUTTER_VERSION"
          "$HOME/.pub-cache/bin/fvm" use "$FLUTTER_VERSION" --force

      - name: Install locked Protocol dependencies
        working-directory: protocol
        run: bun install --frozen-lockfile

      - name: Resolve locked Protocol Dart dependencies
        working-directory: protocol/dart
        run: fvm dart pub get --enforce-lockfile

      - name: Run the full Protocol check
        working-directory: protocol
        run: bun run check

      - name: Verify tracked Protocol sources remain unchanged
        run: git diff --exit-code -- protocol

  linux-platforms:
    name: Android, Web, and Linux builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17 for Android
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Dart ${{ env.DART_VERSION }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/${{ env.FLUTTER_VERSION }}
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-fvm-${{ env.FVM_VERSION }}

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Install FVM and Flutter
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" install "$FLUTTER_VERSION"
          "$HOME/.pub-cache/bin/fvm" use "$FLUTTER_VERSION" --force
          "$HOME/.pub-cache/bin/fvm" flutter config --enable-linux-desktop

      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile

      - name: Build Android debug APK
        run: fvm flutter build apk --debug --no-pub

      - name: Verify Android remains a connect-only artifact
        run: |
          APK_ROOT="$RUNNER_TEMP/pi-client-android-apk"
          mkdir -p "$APK_ROOT"
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d "$APK_ROOT"
          node .github/scripts/assert-connect-only-artifact.mjs android "$APK_ROOT"

      - name: Build Web release bundle
        run: fvm flutter build web --release --no-pub

      - name: Verify Web remains a connect-only artifact
        run: node .github/scripts/assert-connect-only-artifact.mjs web build/web

      - name: Build Linux debug bundle
        run: fvm flutter build linux --debug --no-pub

  apple-platforms:
    name: macOS and unsigned iOS builds
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Dart ${{ env.DART_VERSION }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/${{ env.FLUTTER_VERSION }}
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-fvm-${{ env.FVM_VERSION }}

      - name: Install FVM and Flutter
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" install "$FLUTTER_VERSION"
          "$HOME/.pub-cache/bin/fvm" use "$FLUTTER_VERSION" --force
          "$HOME/.pub-cache/bin/fvm" flutter config --enable-macos-desktop

      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile

      - name: Build macOS debug app
        run: fvm flutter build macos --debug --no-pub

      - name: Build unsigned iOS debug app
        run: fvm flutter build ios --debug --no-codesign --no-pub

      - name: Verify iOS remains a connect-only artifact
        run: node .github/scripts/assert-connect-only-artifact.mjs ios build/ios/iphoneos/Runner.app

  windows-platform:
    name: Windows build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart ${{ env.DART_VERSION }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Cache Flutter SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/fvm/versions/${{ env.FLUTTER_VERSION }}
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-fvm-${{ env.FVM_VERSION }}

      - name: Install FVM and Flutter
        shell: pwsh
        run: |
          dart pub global activate fvm "$env:FVM_VERSION"
          $pubCacheBin = Join-Path $env:LOCALAPPDATA 'Pub\Cache\bin'
          $pubCacheBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fvm = Join-Path $pubCacheBin 'fvm.bat'
          & $fvm install "$env:FLUTTER_VERSION"
          & $fvm use "$env:FLUTTER_VERSION" --force
          & $fvm flutter config --enable-windows-desktop

      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile

      - name: Build Windows debug bundle
        run: fvm flutter build windows --debug --no-pub
