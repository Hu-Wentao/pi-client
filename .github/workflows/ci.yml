name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: 22.19.0

jobs:
  quality:
    name: Flutter, release tooling, and site quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up pinned Flutter without composite Dart matcher conflicts
        uses: ./.github/actions/setup-flutter

      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile

      - name: Verify generated Dart sources
        run: |
          fvm dart run build_runner build
          git diff --exit-code -- lib test

      - name: Format, analyze, and test Flutter source
        run: |
          fvm dart format --output=none --set-exit-if-changed lib test tool
          fvm flutter analyze --no-pub
          fvm flutter test --no-pub --exclude-tags golden

      - name: Test release, Homebrew, Preview, and workflow contracts
        run: node --test test/homebrew_cask_test.mjs test/release_contract_test.mjs test/preview_artifacts_test.mjs test/workflow_policy_test.mjs

      - name: Validate publication-disabled independent release metadata
        run: node tool/release_metadata.mjs --require-profile independent-six-platform-development-v1

      - name: Install and validate the independent Landing Page
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bun run validate

      - name: Verify tracked source remains unchanged
        run: git diff --exit-code

  protocol:
    name: Pi Protocol package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install locked Protocol dependencies
        working-directory: protocol
        run: bun install --frozen-lockfile
      - name: Resolve locked Protocol Dart dependencies
        working-directory: protocol/dart
        run: fvm dart pub get --enforce-lockfile
      - name: Run the full Protocol check
        working-directory: protocol
        run: bun run check
      - name: Verify tracked Protocol sources remain unchanged
        run: git diff --exit-code -- protocol

  node:
    name: First-party Pi Node and runtime Capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked Pi Node dependencies
        working-directory: node
        run: bun install --frozen-lockfile
      - name: Run Pi Node, Capsule, packaging, tamper, and forbidden-artifact checks
        working-directory: node
        run: bun run check
      - name: Verify tracked Pi Node sources remain unchanged
        run: git diff --exit-code -- node protocol

  linux-platforms:
    name: Android, Web JS/WASM, and Linux builds
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang cmake libgtk-3-dev liblzma-dev libsecret-1-dev ninja-build pkg-config
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile
      - name: Build Android debug APK and verify connect-only boundary
        run: |
          fvm flutter build apk --debug --no-pub
          mkdir -p "$RUNNER_TEMP/android-apk"
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d "$RUNNER_TEMP/android-apk"
          node .github/scripts/assert-connect-only-artifact.mjs android "$RUNNER_TEMP/android-apk"
      - name: Build Web JavaScript and verify connect-only boundary
        run: |
          fvm flutter build web --release --no-pub
          test -s build/web/main.dart.js
          node .github/scripts/assert-connect-only-artifact.mjs web build/web
      - name: Build WebAssembly and verify no-secret connect-only boundary
        run: |
          fvm flutter build web --wasm --release --no-pub
          test -s build/web/main.dart.wasm
          node .github/scripts/assert-connect-only-artifact.mjs web-wasm build/web
      - name: Build Linux debug bundle without a packaged runtime Capsule
        run: |
          fvm flutter build linux --debug --no-pub
          test ! -e build/linux/x64/debug/bundle/lib/pi-client/PiNode
          node .github/scripts/assert-no-runtime-capsule.mjs build/linux/x64/debug/bundle

  apple-platforms:
    name: macOS and unsigned iOS builds
    needs: quality
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile
      - name: Run desktop Golden on macOS
        run: fvm flutter test test/workspace_golden_test.dart --no-pub
      - name: Build macOS debug app without a downloaded runtime Capsule
        run: |
          fvm flutter build macos --debug --no-pub
          APP='build/macos/Build/Products/Debug/Pi Client.app'
          test -d "$APP"
          test ! -e "$APP/Contents/Resources/PiNode"
          node .github/scripts/assert-no-runtime-capsule.mjs "$APP"
          ! grep -Eq 'app-sandbox|disable-library-validation|allow-unsigned-executable-memory' macos/Runner/Debug.entitlements
      - name: Build unsigned iOS debug app and verify connect-only boundary
        run: |
          fvm flutter build ios --debug --no-codesign --no-pub
          node .github/scripts/assert-connect-only-artifact.mjs ios build/ios/iphoneos/Runner.app

  windows-platform:
    name: Windows build
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Resolve locked Flutter dependencies
        run: fvm flutter pub get --enforce-lockfile
      - name: Build Windows debug bundle without a packaged runtime Capsule
        shell: pwsh
        run: |
          fvm flutter build windows --debug --no-pub
          if (Test-Path 'build/windows/x64/runner/Debug/PiNode') { throw 'Ordinary Windows source build unexpectedly contains PiNode.' }
