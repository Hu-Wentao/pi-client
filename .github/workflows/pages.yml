name: Landing page

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tool/release_metadata.mjs'
      - '.github/workflows/pages.yml'
      - 'pubspec.yaml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tool/release_metadata.mjs'
      - '.github/workflows/pages.yml'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Validate release metadata
        run: node tool/release_metadata.mjs

      - name: Check Astro source
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run check

      - name: Build Astro site
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Validate built site
        working-directory: site
        run: bun run validate

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  release-asset:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.asset.outputs.exists }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve release metadata
        id: metadata
        run: node tool/release_metadata.mjs --github-output "$GITHUB_OUTPUT"

      - name: Check published release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          ASSET: ${{ steps.metadata.outputs.asset }}
        run: |
          if RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)" && \
            [[ "$(jq -r '.draft' <<<"$RELEASE_JSON")" == 'false' ]] && \
            [[ "$(jq --arg name "$ASSET" '[.assets[] | select(.name == $name and .size > 0)] | length' <<<"$RELEASE_JSON")" == '1' ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo "Skipping deployment until published ${TAG}/${ASSET} exists with non-zero bytes."
          fi

  deploy:
    if: needs.release-asset.outputs.exists == 'true'
    needs: [build, release-asset]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
