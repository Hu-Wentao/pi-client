name: pi_client
description: "A native Flutter client for the pi coding agent."
publish_to: 'none'
version: 0.0.2+2

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.0
  efficient_dio_logger: ^2.0.2
  flowr: ^6.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fr_acdd: ^0.7.0
  fr_mvvm_env: ^2.0.2
  fr_mvvm_locale: ^2.0.2
  fr_mvvm_theme: ^0.1.1
  fr_storage: ^0.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  retrofit: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9

flutter:
  uses-material-design: true
