name: pi_client
description: "A cross-platform Flutter client for the pi coding agent."
publish_to: 'none'
version: 0.0.2+2

environment:
  sdk: ^3.11.4

dependencies:
  crypto: 3.0.7
  fixnum: 1.1.1
  flowr: ^6.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fr_acdd: ^0.7.0
  fr_mvvm_locale: ^2.0.2
  fr_mvvm_theme: ^0.1.1
  fr_storage: ^0.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  pi_client_protocol_spike:
    path: protocol/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
